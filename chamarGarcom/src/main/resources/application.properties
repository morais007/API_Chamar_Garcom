spring.application.name=chamarGarcom
server.port=8080
# Habilita o console web do H2
spring.h2.console.enabled=true
# Define o caminho para acessar no navegador (ex: http://localhost:8080/h2-console)
spring.h2.console.path=/h2-console

# Dados de conex�o com o banco de dados
spring.datasource.url=jdbc:h2:mem:chamarGarcom
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configura��es do Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# ddl-auto: update (atualiza a estrutura) ou create-drop (recria a cada rein�cio)
spring.jpa.hibernate.ddl-auto=update
# Mostra os comandos SQL executados no console da IDE
spring.jpa.show-sql=true

# Reduz o log geral da aplica��o (mostra apenas avisos e erros)
logging.level.root=WARN
